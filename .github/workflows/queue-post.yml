name: Queue Branded Post

# Adding a JSON spec under branded/queue/ adds that post to the Buffer queue.
on:
  push:
    paths:
      - 'branded/queue/*.json'

jobs:
  queue:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Create credentials from secrets
        run: |
          cat > scripts/credentials.py << 'EOF'
          import os
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          BUFFER_ACCESS_TOKEN = os.environ.get("BUFFER_ACCESS_TOKEN", "")
          BUFFER_ORG_ID = os.environ.get("BUFFER_ORG_ID", "")
          IMGBB_API_KEY = os.environ.get("IMGBB_API_KEY", "")
          EOF

      - name: Queue newly added posts
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          NEW=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'branded/queue/*.json')
          if [ -z "$NEW" ]; then echo "No new posts to queue"; exit 0; fi
          cd scripts
          for f in $NEW; do python queue_post.py "../$f"; done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
