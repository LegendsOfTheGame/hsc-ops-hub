name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Cache busting: index.html reads this to load every file with ?v=<commit>
      - name: Stamp release version
        run: |
          python3 -c "import json, os, pathlib; files = sorted(str(p.relative_to('app')) for p in pathlib.Path('app').rglob('*.js')); json.dump({'v': os.environ['GITHUB_SHA'][:8], 'files': files}, open('app/version.json', 'w'))"
          cat app/version.json
      - uses: actions/upload-pages-artifact@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: ./app
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
