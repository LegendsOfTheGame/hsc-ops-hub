name: Weather Alert Watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  alert-watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Create credentials from secrets
        run: |
          cat > scripts/credentials.py << 'EOF'
          import os
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          BUFFER_ACCESS_TOKEN = os.environ.get("BUFFER_ACCESS_TOKEN", "")
          BUFFER_ORG_ID = os.environ.get("BUFFER_ORG_ID", "")
          IMGBB_API_KEY = os.environ.get("IMGBB_API_KEY", "")
          EOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}

      - name: Run alert watch
        run: cd scripts && python weather.py --alert-watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
